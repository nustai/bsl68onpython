[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bsl68py"
version = "1.1.0"
description = "Python port of the BSL v68 server emulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyNaCl>=1.5.0,<2"]

[project.scripts]
bsl68py = "bsl68.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
